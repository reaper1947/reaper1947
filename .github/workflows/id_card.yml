name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Get Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'
      - name: Configure pip cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USER_NAME: reaper1947
        run: python today.py
      - name: Commit
        run: |-
          git add .
          git diff
          git config --global user.email "reaper1947@users.noreply.github.com"
          git config --global user.name "reaper1947"
          git commit -m "Updated README ID Card" -a || echo "No changes to commit"
          git push
